version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Esperar 7 días antes de proponer una versión nueva: los paquetes maliciosos
    # suelen detectarse y retirarse en sus primeros días.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
